[project]
name = "caraml-examples"
version = "0.1.0"
description = "Example usages of caramlops tooling"
authors = []
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT License"
dependencies = [
    "caraml",
    "torch>=2.6.0,<3",
    "pandas>=2.2.3,<3",
    "scipy>=1.14.1,<2",
    "tensorflow>=2.18.0,<3",
    "onnx>=1.22.0,<2",
    "onnxruntime>=1.20.1,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
caraml = { path = "../caraml/", editable = true }
